<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto</title>
</head>
<body>
    <form action="produto_novo.php" >
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder= "Ex: Agulha" required>
        <br><br>
        <label for="preco">Preço</label>
        <input type="number" id="preco" placeholder= "Ex: 1.50" step="0.01" required>
        <br><br>
        <label for="estoque">Estoque</label>
        <input type="number" id="estoque" placeholder= "Ex: 100">
        <br><br>
        <label for="ativo">Ativo</label>
        <input type="checkbox" id="ativo">
        <br><br>

        <button type="button" id="btnCadastrar"> Cadastrar</button>
    </form>
    <script src="../js/cadastrar_produto.js"></script>
</body>
</html>
